<h2>商城要展示哪类产品？</h2>
<p class="subtitle">了解产品类型，有助于确定卡片信息密度和布局方向</p>

<div class="options">
    <div class="option" data-choice="a" onclick="toggleSelect(this)">
        <div class="letter">A</div>
        <div class="content">
            <h3>🌿 养生实物商品</h3>
            <p>
                中草药、节气礼盒、食疗食材、养生茶等有形商品，需要展示价格、规格、库存、购买按钮
            </p>
        </div>
    </div>
    <div class="option" data-choice="b" onclick="toggleSelect(this)">
        <div class="letter">B</div>
        <div class="content">
            <h3>📋 健康服务套餐</h3>
            <p>
                在线问诊、专家咨询、体质检测、节气调理方案等服务类产品，需要展示服务说明、时长、预约入口
            </p>
        </div>
    </div>
    <div class="option" data-choice="c" onclick="toggleSelect(this)">
        <div class="letter">C</div>
        <div class="content">
            <h3>🛒 实物 + 服务混合</h3>
            <p>商城同时包含实物和服务，需要分区或分类标签切换</p>
        </div>
    </div>
</div>
