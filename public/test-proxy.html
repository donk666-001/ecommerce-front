<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite Proxy Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Vite 代理测试</h1>
    
    <div>
        <button onclick="testProxy()">测试代理请求</button>
        <button onclick="testDirect()">测试直接请求</button>
    </div>
    
    <div id="results"></div>

    <script>
        async function testProxy() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">正在测试代理请求...</div>';
            
            try {
                console.log('[Test] 发起代理请求: /e-commerce/api/users/refresh');
                
                const response = await fetch('/e-commerce/api/users/refresh', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                console.log('[Test] 响应状态:', response.status);
                console.log('[Test] 响应头:', Object.fromEntries(response.headers.entries()));
                
                const contentType = response.headers.get('content-type');
                let resultText = '';
                
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    resultText = JSON.stringify(data, null, 2);
                } else {
                    resultText = await response.text();
                }
                
                resultsDiv.innerHTML = `
                    <div class="test-result ${response.ok ? 'success' : 'error'}">
                        <h3>代理请求结果</h3>
                        <p><strong>状态码:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Content-Type:</strong> ${contentType}</p>
                        <p><strong>完整URL:</strong> ${window.location.origin}/e-commerce/api/users/refresh</p>
                        <pre>${resultText}</pre>
                    </div>
                `;
            } catch (error) {
                console.error('[Test] 请求失败:', error);
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        <h3>请求失败</h3>
                        <p>${error.message}</p>
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    </div>
                `;
            }
        }
        
        async function testDirect() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="test-result">正在测试直接请求...</div>';
            
            try {
                console.log('[Test] 发起直接请求: http://localhost:9090/users/refresh');
                
                const response = await fetch('http://localhost:9090/users/refresh', {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                console.log('[Test] 响应状态:', response.status);
                
                const contentType = response.headers.get('content-type');
                let resultText = '';
                
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    resultText = JSON.stringify(data, null, 2);
                } else {
                    resultText = await response.text();
                }
                
                resultsDiv.innerHTML = `
                    <div class="test-result ${response.ok ? 'success' : 'error'}">
                        <h3>直接请求结果</h3>
                        <p><strong>状态码:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Content-Type:</strong> ${contentType}</p>
                        <pre>${resultText}</pre>
                    </div>
                `;
            } catch (error) {
                console.error('[Test] 请求失败:', error);
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        <h3>请求失败</h3>
                        <p>${error.message}</p>
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
